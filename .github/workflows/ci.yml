name: CI

# Third-party actions are pinned to full commit SHAs (verified, signed commits); the comment
# names the release. Update them deliberately, never by moving tag.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Windows-first: the install engine and its integration tests target Windows x64.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Runs before anything else: proves the scanner detects every category without
      # printing values, then scans every committable file for personal data and secrets.
      - name: Privacy scanner self-test
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -SelfTest
      - name: Repository privacy scan
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -Mode Repo
      - name: Privacy scanner clean-CI regression
        shell: pwsh
        run: ./scripts/test-privacy-scan.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
          cache: npm

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend format
        run: npm run format:check
      - name: Frontend lint
        run: npm run lint
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (no network; local mock GitHub + ZIP fixtures)
        run: cargo test --workspace

  release-build:
    # Full release build exactly as published (path remapping, /Brepro), followed by the
    # release privacy scan of the exe and installer. Only the NSIS installer is retained.
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
          cache: npm

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: "1.99.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: npm ci

      - name: Release build + release privacy scan
        shell: pwsh
        run: ./scripts/build-release.ps1 --bundles nsis

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crafthub-nsis-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  linux-release-build:
    # Linux packages are a separate native build. The Windows job above remains the
    # authoritative NSIS build and is intentionally unchanged.
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Tauri Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: Privacy scanner self-test
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -SelfTest
      - name: Repository privacy scan
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -Mode Repo
      - name: Privacy scanner regression (PowerShell Core)
        shell: pwsh
        run: ./scripts/test-privacy-scan.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
          cache: npm

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Rust Linux checks
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo test -p crafthub-core apps_without_adapter_are_never_installable --locked

      - name: Linux package scanner self-test
        shell: pwsh
        run: ./scripts/scan-linux-packages.ps1 -SelfTest

      - name: Build AppImage and Debian packages
        run: bash ./scripts/build-release-linux.sh

      - name: Inspect unverified Linux packages (sanitized, never uploaded)
        if: always()
        shell: bash
        run: |
          # These packages are intentionally not uploaded: they are unverified and may contain
          # the sensitive data this diagnostic is investigating. Keep all inspection on-runner.
          set +e
          appimage=(target/release/bundle/appimage/*.AppImage)
          deb=(target/release/bundle/deb/*.deb)
          if [[ -f "${appimage[0]}" && -f "${deb[0]}" ]]; then
            pwsh -NoProfile -File ./scripts/scan-linux-packages.ps1 \
              -AppImagePath "${appimage[0]}" -DebPath "${deb[0]}"
          else
            echo 'DIAGNOSTIC package files unavailable for inspection'
          fi
          exit 0

      - name: Verify package metadata and launch behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          fail() { echo "Linux verification failure: $1" >&2; exit 1; }
          stage() { echo "Linux verification stage: $1"; }
          diagnose_log() {
            local log="$1"
            if grep -Eqi 'fuse|fusermount|mount|AppImage' "$log"; then
              echo 'AppImage runtime or FUSE support'
            elif grep -Eqi 'webkit|webkitgtk|gtk|libayatana|libssl|GLIBC|not found|shared object' "$log"; then
              echo 'missing Linux runtime library or WebKitGTK dependency'
            elif grep -Eqi 'sandbox|setuid|permission denied|operation not permitted' "$log"; then
              echo 'sandbox or permission restriction'
            elif grep -Eqi 'display|DISPLAY|Xvfb|x server' "$log"; then
              echo 'Xvfb or display initialization'
            else
              echo 'unexpected process exit; captured output was withheld'
            fi
          }
          installed=0
          app_log="$(mktemp)"
          deb_install_log="$(mktemp)"
          deb_log="$(mktemp)"
          cleanup() {
            local status=$?
            if [[ "$installed" -eq 1 ]]; then
              stage 'DEB removal (cleanup)'
              if sudo apt-get remove --yes crafthub > /dev/null 2>"$deb_install_log"; then
                installed=0
              else
                echo 'Linux verification cleanup failure: DEB removal did not complete' >&2
                status=1
              fi
            fi
            rm -f "$app_log" "$deb_install_log" "$deb_log"
            trap - EXIT
            exit "$status"
          }
          trap cleanup EXIT

          stage 'package discovery'
          appimage=(target/release/bundle/appimage/*.AppImage)
          deb=(target/release/bundle/deb/*.deb)
          [[ ${#appimage[@]} -eq 1 ]] || fail "expected exactly one AppImage, found ${#appimage[@]}"
          [[ ${#deb[@]} -eq 1 ]] || fail "expected exactly one DEB, found ${#deb[@]}"
          [[ -f "${appimage[0]}" ]] || fail 'discovered AppImage is not a regular file'
          [[ -f "${deb[0]}" ]] || fail 'discovered DEB is not a regular file'

          stage 'DEB metadata'
          expected_name='crafthub'
          expected_version='0.1.0'
          expected_arch='amd64'
          actual_name=$(dpkg-deb -f "${deb[0]}" Package 2>"$deb_install_log") || fail 'dpkg-deb could not read the package name'
          actual_version=$(dpkg-deb -f "${deb[0]}" Version 2>"$deb_install_log") || fail 'dpkg-deb could not read the package version'
          actual_arch=$(dpkg-deb -f "${deb[0]}" Architecture 2>"$deb_install_log") || fail 'dpkg-deb could not read the package architecture'
          [[ "$actual_name" == "$expected_name" ]] || { echo "Expected package name: $expected_name; actual: $actual_name" >&2; fail 'DEB package name mismatch'; }
          [[ "$actual_version" == "$expected_version" ]] || { echo "Expected package version: $expected_version; actual: $actual_version" >&2; fail 'DEB package version mismatch'; }
          [[ "$actual_arch" == "$expected_arch" ]] || { echo "Expected package architecture: $expected_arch; actual: $actual_arch" >&2; fail 'DEB package architecture mismatch'; }

          stage 'AppImage launch'
          command -v xvfb-run >/dev/null 2>&1 || fail 'xvfb-run is unavailable'
          command -v timeout >/dev/null 2>&1 || fail 'timeout is unavailable'
          chmod +x "${appimage[0]}" || fail 'could not mark AppImage executable'

          # A GUI process staying alive under Xvfb proves the AppImage starts. A
          # non-timeout exit is a failed launch, not a tolerated smoke-test result.
          set +e
          timeout --signal=TERM 20s xvfb-run -a "${appimage[0]}" >"$app_log" 2>&1
          appimage_code=$?
          set -e
          if [[ $appimage_code -ne 124 ]]; then
            fail "AppImage launch exited with status $appimage_code ($(diagnose_log "$app_log"))"
          fi

          stage 'DEB installation'
          if ! sudo apt-get install --yes "${deb[0]}" > /dev/null 2>"$deb_install_log"; then
            fail "DEB installation failed ($(diagnose_log "$deb_install_log"))"
          fi
          installed=1
          command -v crafthub >/dev/null 2>&1 || fail 'DEB installation completed but crafthub was not installed'

          stage 'DEB launch'
          set +e
          timeout --signal=TERM 20s xvfb-run -a crafthub >"$deb_log" 2>&1
          deb_code=$?
          set -e
          if [[ $deb_code -ne 124 ]]; then
            fail "DEB launch exited with status $deb_code ($(diagnose_log "$deb_log"))"
          fi

          stage 'DEB removal'
          if ! sudo apt-get remove --yes crafthub > /dev/null 2>"$deb_install_log"; then
            fail "DEB removal failed ($(diagnose_log "$deb_install_log"))"
          fi
          installed=0
          command -v crafthub >/dev/null 2>&1 && fail 'DEB removal completed but crafthub remains installed'
          echo 'Linux verification completed successfully'

      - name: Linux package privacy scan
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -Mode LinuxRelease

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crafthub-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Debian artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crafthub-linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
