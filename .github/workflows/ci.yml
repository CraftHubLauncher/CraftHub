name: CI

# Third-party actions are pinned to full commit SHAs (verified, signed commits); the comment
# names the release. Update them deliberately, never by moving tag.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Windows-first: the install engine and its integration tests target Windows x64.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Runs before anything else: proves the scanner detects every category without
      # printing values, then scans every committable file for personal data and secrets.
      - name: Privacy scanner self-test
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -SelfTest
      - name: Repository privacy scan
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -Mode Repo
      - name: Privacy scanner clean-CI regression
        shell: pwsh
        run: ./scripts/test-privacy-scan.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
          cache: npm

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend format
        run: npm run format:check
      - name: Frontend lint
        run: npm run lint
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (no network; local mock GitHub + ZIP fixtures)
        run: cargo test --workspace

  release-build:
    # Full release build exactly as published (path remapping, /Brepro), followed by the
    # release privacy scan of the exe and installer. Only the NSIS installer is retained.
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
          cache: npm

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: "1.99.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: npm ci

      - name: Release build + release privacy scan
        shell: pwsh
        run: ./scripts/build-release.ps1 --bundles nsis

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crafthub-nsis-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  linux-release-build:
    # Linux packages are a separate native build. The Windows job above remains the
    # authoritative NSIS build and is intentionally unchanged.
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Tauri Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: Privacy scanner self-test
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -SelfTest
      - name: Repository privacy scan
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -Mode Repo
      - name: Privacy scanner regression (PowerShell Core)
        shell: pwsh
        run: ./scripts/test-privacy-scan.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
          cache: npm

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Rust Linux checks
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo test -p crafthub-core apps_without_adapter_are_never_installable --locked

      - name: Build AppImage and Debian packages
        run: bash ./scripts/build-release-linux.sh

      - name: Inspect unverified Linux packages (sanitized, never uploaded)
        if: always()
        shell: bash
        run: |
          # These packages are intentionally not uploaded: they are unverified and may contain
          # the sensitive data this diagnostic is investigating. Keep all inspection on-runner.
          set +e
          diag="${RUNNER_TEMP}/crafthub-linux-package-diagnostic"
          rm -rf "$diag"
          mkdir -p "$diag"
          appimage=(target/release/bundle/appimage/*.AppImage)
          deb=(target/release/bundle/deb/*.deb)

          if [[ -f "${appimage[0]}" ]]; then
            mkdir -p "$diag/appimage-extract"
            (cd "$diag/appimage-extract" && "${GITHUB_WORKSPACE}/${appimage[0]}" --appimage-extract >/dev/null 2>&1)
            if [[ -d "$diag/appimage-extract/squashfs-root" ]]; then
              mv "$diag/appimage-extract/squashfs-root" "$diag/appimage-root"
            else
              echo 'DIAGNOSTIC AppImage payload extraction unavailable'
            fi
          fi

          if [[ -f "${deb[0]}" ]]; then
            dpkg-deb -x "${deb[0]}" "$diag/deb-root" >/dev/null 2>&1
            if [[ ! -d "$diag/deb-root" ]]; then
              echo 'DIAGNOSTIC DEB payload extraction unavailable'
            fi
          fi

          python3 - "$diag" "${appimage[0]}" "${deb[0]}" <<'PY' 2>/dev/null
          import os
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          unix_home = re.compile(rb'/(?:home|Users)/(?!runner/|<)[a-z_][a-z0-9_.-]{1,31}/', re.I)
          email = re.compile(rb'[A-Za-z0-9._%+-]{2,64}@[A-Za-z0-9-]{1,63}(?:\.[A-Za-z0-9-]{1,63}){1,3}\b')

          def scan_file(path, label):
              try:
                  data = path.read_bytes()
              except Exception:
                  return
              findings = []
              for category, pattern in (('unix home path', unix_home), ('e-mail address', email)):
                  count = len(pattern.findall(data))
                  if count:
                      findings.append((category, count))
              if findings:
                  # Only controlled package-relative names, categories, and counts are printed.
                  rel = path.name if label.endswith('outer file') else os.path.relpath(path, root).replace('\\', '/')
                  for category, count in findings:
                      print(f'DIAGNOSTIC {label}/{rel} : {category} ({count})')

          def scan_tree(path, label):
              if path.is_file():
                  scan_file(path, label)
              elif path.is_dir():
                  for child in path.rglob('*'):
                      if child.is_file():
                          scan_file(child, label)

          for raw, label in ((sys.argv[2], 'AppImage outer file'), (sys.argv[3], 'DEB outer file')):
              if raw and raw != '':
                  scan_file(Path(raw), label)
          scan_tree(root / 'appimage-root', 'AppImage payload')
          scan_tree(root / 'deb-root', 'DEB payload')
          PY
          exit 0

      - name: Verify package metadata and launch behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          appimage=(target/release/bundle/appimage/*.AppImage)
          deb=(target/release/bundle/deb/*.deb)
          [[ ${#appimage[@]} -eq 1 && ${#deb[@]} -eq 1 ]]
          [[ "$(dpkg-deb -f "${deb[0]}" Package)" == "crafthub" ]]
          [[ "$(dpkg-deb -f "${deb[0]}" Version)" == "0.1.0" ]]
          [[ "$(dpkg-deb -f "${deb[0]}" Architecture)" == "amd64" ]]
          file "${appimage[0]}" "${deb[0]}"
          chmod +x "${appimage[0]}"

          # A GUI process staying alive under Xvfb proves the AppImage starts. A
          # non-timeout exit is a failed launch, not a tolerated smoke-test result.
          set +e
          timeout --signal=TERM 20s xvfb-run -a "${appimage[0]}" >/tmp/crafthub-appimage.log 2>&1
          appimage_code=$?
          set -e
          if [[ $appimage_code -ne 124 ]]; then
            cat /tmp/crafthub-appimage.log
            echo "AppImage exited before the launch window (status $appimage_code)" >&2
            exit 1
          fi

          sudo apt-get install --yes "${deb[0]}"
          command -v crafthub
          set +e
          timeout --signal=TERM 20s xvfb-run -a crafthub >/tmp/crafthub-deb.log 2>&1
          deb_code=$?
          set -e
          if [[ $deb_code -ne 124 ]]; then
            cat /tmp/crafthub-deb.log
            echo "Installed Debian package exited before the launch window (status $deb_code)" >&2
            exit 1
          fi
          sudo apt-get remove --yes crafthub
          ! command -v crafthub

      - name: Linux package privacy scan
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -Mode LinuxRelease

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crafthub-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Debian artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crafthub-linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
