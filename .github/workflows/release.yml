name: Release (Windows and Linux)

# Builds the CraftHub NSIS installer when a version tag (vX.Y.Z) is pushed and attaches it to a
# DRAFT GitHub release for a maintainer to review and publish.
#
# Integrity measures:
#   * third-party actions pinned to verified commit SHAs (the comment names the release);
#   * no build cache in this workflow (a poisoned cache from another build cannot reach a release);
#   * the same checks as CI, Cargo.lock / package-lock.json enforced, versions matched to the tag;
#   * privacy scans (self-test, repository, release binaries);
#   * SHA256SUMS.txt over every published file, plus a GitHub build-provenance attestation
#     (Sigstore) that ties each file to this workflow run and commit;
#   * uploaded assets are downloaded again and compared with the local hashes.
#
# Self-update artifacts are produced only when ALL of these are configured:
#   secrets.TAURI_SIGNING_PRIVATE_KEY (+ optional secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
#   vars.CRAFTHUB_UPDATER_PUBKEY      (public key matching the private key)
#   PRODUCTION_REPOSITORY in src-tauri/src/selfupdate.rs == this repository, and the bundle
#   identifier == io.github.<owner>.crafthub
# Installers are NOT Authenticode-signed; see docs/RELEASING.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Tauri Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: Privacy scanner self-test + repository scan
        shell: pwsh
        run: |
          ./scripts/privacy-scan.ps1 -SelfTest
          ./scripts/privacy-scan.ps1 -Mode Repo

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-gnu

      - name: Versions match the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          foreach ($v in @($tauri, $npm, $cargo)) {
            if ("v$v" -ne $tag) { throw "tag $tag does not match versions tauri=$tauri npm=$npm cargo=$cargo" }
          }

      - name: Build both native Linux packages
        run: |
          npm ci
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo test -p crafthub-core apps_without_adapter_are_never_installable --locked
          bash ./scripts/build-release-linux.sh

      - name: Validate package metadata and launch under Xvfb
        shell: bash
        run: |
          set -Eeuo pipefail
          appimage=(target/release/bundle/appimage/*.AppImage)
          deb=(target/release/bundle/deb/*.deb)
          [[ ${#appimage[@]} -eq 1 && ${#deb[@]} -eq 1 ]]
          [[ "$(dpkg-deb -f "${deb[0]}" Package)" == "crafthub" ]]
          version="${GITHUB_REF_NAME#v}"
          [[ "$(dpkg-deb -f "${deb[0]}" Version)" == "$version" ]]
          [[ "$(dpkg-deb -f "${deb[0]}" Architecture)" == "amd64" ]]
          chmod +x "${appimage[0]}"
          set +e
          timeout --signal=TERM 20s xvfb-run -a "${appimage[0]}" >/tmp/crafthub-appimage.log 2>&1
          appimage_code=$?
          set -e
          if [[ $appimage_code -ne 124 ]]; then cat /tmp/crafthub-appimage.log; exit 1; fi
          sudo apt-get install --yes "${deb[0]}"
          set +e
          timeout --signal=TERM 20s xvfb-run -a crafthub >/tmp/crafthub-deb.log 2>&1
          deb_code=$?
          set -e
          if [[ $deb_code -ne 124 ]]; then cat /tmp/crafthub-deb.log; exit 1; fi
          sudo apt-get remove --yes crafthub
          ! command -v crafthub

      - name: Linux package privacy scan
        shell: pwsh
        run: ./scripts/privacy-scan.ps1 -Mode LinuxRelease

      - name: Upload validated Linux AppImage for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crafthub-linux-release-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload validated Linux Debian package for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crafthub-linux-release-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the draft release
      id-token: write # build-provenance attestation (Sigstore)
      attestations: write
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.CRAFTHUB_UPDATER_PUBKEY != '' }}
      NSIS_DIR: target/release/bundle/nsis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Privacy scanner self-test + repository scan
        shell: pwsh
        run: |
          ./scripts/privacy-scan.ps1 -SelfTest
          ./scripts/privacy-scan.ps1 -Mode Repo

      - name: Versions match the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          foreach ($v in @($tauri, $npm, $cargo)) {
            if ("v$v" -ne $tag) { throw "tag $tag does not match versions tauri=$tauri npm=$npm cargo=$cargo" }
          }

      - name: Self-update identity check
        # Signed update artifacts are only produced for the real repository; the app itself
        # also refuses to enable self-update otherwise (src-tauri/src/selfupdate.rs).
        if: env.HAS_UPDATER_KEY == 'true'
        shell: pwsh
        run: |
          $id = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).identifier
          $expected = "io.github.${{ github.repository_owner }}.crafthub".ToLowerInvariant()
          if ($id.ToLowerInvariant() -ne $expected) {
            throw "Bundle identifier must be '$expected' before self-update artifacts are published (found '$id')."
          }
          $m = Select-String -Path src-tauri/src/selfupdate.rs -Pattern 'PRODUCTION_REPOSITORY: Option<&str> = Some\("([^"]+)"\)'
          if (-not $m -or $m.Matches[0].Groups[1].Value -cne "${{ github.repository }}") {
            throw "PRODUCTION_REPOSITORY in selfupdate.rs must be Some(`"${{ github.repository }}`")."
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Same checks as CI (lockfiles enforced)
        shell: pwsh
        run: |
          npm ci
          npm run format:check; if ($LASTEXITCODE) { exit 1 }
          npm run lint; if ($LASTEXITCODE) { exit 1 }
          npm run typecheck; if ($LASTEXITCODE) { exit 1 }
          npm test; if ($LASTEXITCODE) { exit 1 }
          cargo fmt --all --check; if ($LASTEXITCODE) { exit 1 }
          cargo clippy --workspace --all-targets --locked -- -D warnings; if ($LASTEXITCODE) { exit 1 }
          cargo test --workspace --locked; if ($LASTEXITCODE) { exit 1 }

      - name: Build (unsigned updater)
        if: env.HAS_UPDATER_KEY != 'true'
        shell: pwsh
        run: ./scripts/build-release.ps1 --bundles nsis

      - name: Build (with signed self-update artifacts)
        if: env.HAS_UPDATER_KEY == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CRAFTHUB_UPDATER_PUBKEY: ${{ vars.CRAFTHUB_UPDATER_PUBKEY }}
          CRAFTHUB_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          ./scripts/build-release.ps1 --bundles nsis --config src-tauri/tauri.updater.conf.json
          $setup = Get-ChildItem $env:NSIS_DIR -Filter *-setup.exe | Select-Object -First 1
          $sig = Get-Content "$($setup.FullName).sig" -Raw
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $manifest = [ordered]@{
            version = $version
            notes = "See the release notes on GitHub."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($setup.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "$env:NSIS_DIR/latest.json" -Encoding utf8

      - name: Download validated Linux packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crafthub-linux-release-appimage
          path: ${{ env.NSIS_DIR }}

      - name: Download validated Linux Debian package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crafthub-linux-release-deb
          path: ${{ env.NSIS_DIR }}

      - name: Checksums for every published file
        shell: pwsh
        run: |
          $files = Get-ChildItem $env:NSIS_DIR -File | Where-Object { $_.Name -match '\.(exe|sig|json|AppImage|deb)$' }
          if (-not ($files | Where-Object Name -like '*-setup.exe')) { throw "installer missing" }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content "$env:NSIS_DIR/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$env:NSIS_DIR/SHA256SUMS.txt"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*.AppImage
            target/release/bundle/nsis/*.deb
            target/release/bundle/nsis/SHA256SUMS.txt

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem $env:NSIS_DIR -File | Where-Object { $_.Name -match '\.(exe|sig|json|txt|AppImage|deb)$' }
          $body = @"
          Unofficial community application manager. Not affiliated with or endorsed by Storytold or ArtCraft.

          **The installer is not code-signed.** Windows SmartScreen will warn that the publisher is unknown.
          Before running it, compare its SHA-256 with SHA256SUMS.txt, or verify its build provenance:
          ``gh attestation verify <installer> --repo ${{ github.repository }}``
          "@
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft `
            --title "CraftHub ${{ github.ref_name }}" --notes $body @($files.FullName)
          if ($LASTEXITCODE) { exit 1 }

      - name: Verify uploaded assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dl = Join-Path $env:RUNNER_TEMP "release-verify"
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir $dl
          if ($LASTEXITCODE) { exit 1 }
          foreach ($line in Get-Content "$env:NSIS_DIR/SHA256SUMS.txt") {
            $hash, $name = $line -split '\s+', 2
            $got = (Get-FileHash (Join-Path $dl $name) -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $hash) { throw "uploaded $name does not match the built file" }
          }
          Write-Host "all uploaded assets match SHA256SUMS.txt"
